version: "3.8"

services:
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: docker-sandbox-selenium
    shm_size: 2gb
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - SE_VNC_NO_PASSWORD=1
      - SE_SCREEN_WIDTH=1800
      - SE_SCREEN_HEIGHT=960
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    ports:
      - "4444:4444"
      - "7900:7900"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  ubuntu:
    build:
      context: .
    container_name: docker-sandbox-ubuntu
    stdin_open: true
    tty: true
    working_dir: /home/selenium/tests
    volumes:
      - .:/home/selenium/tests
    environment:
      - SELENIUM_URL=http://selenium:4444/wd/hub
      - HEADLESS=true
    depends_on:
      selenium:
        condition: service_healthy
